<style>
html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.login { max-width: 420px; display: grid; gap: 12px; }
.login input { width: 100%; }
/* Layout: céu noturno com brilho de zênite no topo; barra do lutador fixa, abas, painéis em grade que viram coluna no celular. */
:root {
  --sky-0: #0a0d1c;
  --sky-1: #11162e;
  --sky-2: #182042;
  --sky-3: #222b55;
  --line: #2e3a6e;
  --fg: #ece8f6;
  --muted: #9ba2c8;
  --faint: #6c7399;
  --sun: #ffcf70;
  --sun-ink: #21160a;
  --ki: #6cc6ff;
  --hp: #ff6b7d;
  --good: #63d9a0;
  --bad: #ff6b6b;
  --xp: #c9a2ff;
  --c-devorador: #a978ff;
  --c-danca: #ff5f8f;
  --c-batedor: #3fd6a4;
  --c-sentinela: #77a3ff;
  --c-arauto: #ff8c42;
  --c-porta: #c3e45f;
  --c-npc: #d66a5a;
  --f-display: "Marcellus SC", "Trajan Pro", Georgia, serif;
  --f-ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--sky-0);
  color: var(--fg);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 70% 40% at 50% -8%, rgba(255,207,112,.16), transparent 70%),
    radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 64% 38%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 32% 64%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 88% 72%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 6% 86%, rgba(255,255,255,.3), transparent 60%);
}
#app { position: relative; z-index: 1; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.12rem; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: .86rem; }
.label { font-size: .74rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.grid2 > *, .grid3 > * { min-width: 0; }

/* Barra do lutador */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(10,13,28,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.hud-in { display: flex; gap: 14px; align-items: center; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 1.35rem; letter-spacing: .14em; color: var(--sun); }
.hud-me { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; flex-wrap: wrap; }
.hud-name { font-weight: 700; white-space: nowrap; }
.bars { display: grid; gap: 4px; min-width: 150px; flex: 1; max-width: 300px; }
.bar { position: relative; height: 9px; border-radius: 5px; background: var(--sky-3); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; transition: width .5s ease; }
.bar.hp > i { background: linear-gradient(90deg, #e2475f, var(--hp)); }
.bar.ki > i { background: linear-gradient(90deg, #3b8fd6, var(--ki)); }
.bar.xp > i { background: linear-gradient(90deg, #8b5fd8, var(--xp)); }
.bar-txt { display: flex; justify-content: space-between; font-size: .74rem; color: var(--muted); }
.gold { color: var(--sun); font-weight: 700; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.warn { border-color: rgba(255,207,112,.5); color: var(--sun); }
.chip.bad { border-color: rgba(255,107,107,.5); color: var(--bad); }
.chip.good { border-color: rgba(99,217,160,.5); color: var(--good); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* Abas */
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 6px 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 14px 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--sun); }
.tab .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--sun); color: var(--sun-ink); font-size: .72rem; line-height: 18px; text-align: center; }

main { padding-block: 22px 60px; }
.panel { background: linear-gradient(180deg, rgba(34,43,85,.55), rgba(17,22,46,.75)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec { display: grid; gap: 14px; margin-bottom: 26px; }
.sec-h { display: flex; justify-content: space-between; align-items: end; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }

.btn { border: 1px solid var(--line); background: var(--sky-2); padding: 8px 14px; border-radius: 8px; font-weight: 600; letter-spacing: .02em; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover:not(:disabled) { border-color: var(--muted); background: var(--sky-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.btn.primary:hover:not(:disabled) { background: #ffe0a0; border-color: #ffe0a0; }
.btn.danger { border-color: rgba(255,107,107,.6); color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: .86rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
input[type=text], input[type=number], select { background: var(--sky-1); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
input[type=text] { width: 100%; }

.list { display: grid; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; background: rgba(10,13,28,.45); border: 1px solid rgba(46,58,110,.7); flex-wrap: wrap; }
.item > .grow { flex: 1; min-width: 180px; display: grid; gap: 2px; }
.item.done { opacity: .55; }
.item-t { font-weight: 700; }
.tag { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; padding: 1px 7px; border-radius: 4px; background: var(--sky-3); color: var(--muted); font-weight: 700; }
.tag.historia { color: var(--sun); }
.tag.chefe { color: var(--hp); }
.tag.grupo { color: var(--c-porta); }
.tag.caca { color: var(--c-arauto); }
.tag.coleta, .tag.entrega { color: var(--c-batedor); }
.tag.expedicao { color: var(--ki); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(46,58,110,.7); white-space: nowrap; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.scroll-x { overflow-x: auto; }

.stat-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed rgba(46,58,110,.7); }
.stat-row b { font-size: 1.1rem; }
.cls-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.move { display: grid; gap: 4px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(10,13,28,.45); }
.stage { font-family: var(--f-display); font-size: .82rem; color: var(--sun); }
.prog { height: 5px; background: var(--sky-3); border-radius: 3px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--sun); }

.fighter-card { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; }
@media (max-width: 480px) { .fighter-card { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
.sil { width: 120px; height: 150px; }

/* Criação */
.hero { padding-block: 34px 20px; display: grid; gap: 10px; }
.hero h1 { font-size: clamp(2.6rem, 9vw, 4.6rem); color: var(--sun); letter-spacing: .12em; line-height: 1; }
.hero p { max-width: 62ch; color: var(--muted); font-size: 1.05rem; }
.cls-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.cls-opt { text-align: left; background: rgba(10,13,28,.5); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; }
.cls-opt[aria-pressed="true"] { border-color: var(--cc); box-shadow: 0 0 0 1px var(--cc), 0 0 24px -8px var(--cc); }
.cls-opt .sil { width: 64px; height: 80px; }
.cls-opt b { font-family: var(--f-display); font-weight: 400; font-size: 1.05rem; color: var(--cc); }

/* Batalha */
.battle { position: fixed; inset: 0; z-index: 100; background: rgba(6,8,18,.96); display: grid; grid-template-rows: auto 1fr auto auto; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px); gap: 10px; overflow: hidden; }
.b-top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; max-width: 900px; width: 100%; margin: 0 auto; }
.b-side { display: grid; gap: 4px; min-width: 0; }
.b-side.r { text-align: right; }
.b-side.r .bar > i { inset: 0 0 0 auto; }
.b-name { font-family: var(--f-display); font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-vs { font-family: var(--f-display); color: var(--sun); font-size: 1.3rem; }
.b-stage { position: relative; display: grid; grid-template-columns: 1fr minmax(120px, 220px) 1fr; align-items: center; max-width: 900px; width: 100%; margin: 0 auto; min-height: 240px; }
.b-stage::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: 14%; height: 2px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
.b-f { position: relative; display: grid; justify-items: center; }
.b-f .sil { width: min(150px, 34vw); height: auto; aspect-ratio: 4/5; max-width: 100%; transition: transform .25s ease, filter .25s; }
.b-f.r .sil { transform: scaleX(-1); }
.b-f.lunge-l .sil { transform: translateX(28%) scale(1.06); }
.b-f.lunge-r .sil { transform: scaleX(-1) translateX(28%) scale(1.06); }
.b-f.hit .sil { animation: hit .35s; filter: brightness(2) saturate(.3); }
.b-f.dodge .sil { opacity: .4; }
.b-f.guard::before { content: ""; position: absolute; inset: 10% 15%; border: 2px solid var(--ki); border-radius: 50%; box-shadow: 0 0 22px var(--ki); animation: pulse .7s ease-out; }
.b-f.charge::before { content: ""; position: absolute; inset: 0 10%; border-radius: 50%; background: radial-gradient(circle, var(--fc) 0%, transparent 65%); opacity: .6; animation: pulse .8s ease-out; }
.b-f.down .sil { transform: translateY(14%) rotate(-14deg); opacity: .35; transition: all 1.2s ease; }
.b-f.r.down .sil { transform: scaleX(-1) translateY(14%) rotate(-14deg); }
@keyframes hit { 0%,100% { translate: 0; } 25% { translate: -7px; } 75% { translate: 7px; } }
@keyframes pulse { from { transform: scale(.6); opacity: 0; } 40% { opacity: .9; } to { transform: scale(1.15); opacity: 0; } }
.float { position: absolute; top: 18%; left: 50%; translate: -50% 0; font-family: var(--f-display); font-size: 1.8rem; font-weight: 400; color: #fff; text-shadow: 0 2px 8px #000; animation: rise 1.1s ease-out forwards; pointer-events: none; white-space: nowrap; }
.float.crit { color: var(--sun); font-size: 2.4rem; }
.float.heal { color: var(--good); }
.float.miss { color: var(--muted); font-size: 1.2rem; }
@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-60px); opacity: 0; } }
.b-cards { display: flex; gap: 10px; justify-content: center; perspective: 600px; }
.card { width: 96px; min-height: 64px; border-radius: 8px; border: 1px solid var(--line); background: var(--sky-2); display: grid; place-items: center; padding: 6px; text-align: center; font-size: .82rem; font-weight: 700; transform: rotateY(90deg); opacity: 0; transition: transform .35s ease, opacity .35s; }
.card.show { transform: rotateY(0); opacity: 1; }
.b-ult { position: absolute; inset: -20% -50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(0,0,0,.4), rgba(0,0,0,.92) 70%); z-index: 3; font-family: var(--f-display); font-size: clamp(1.8rem, 7vw, 3.4rem); color: var(--sun); text-align: center; letter-spacing: .08em; animation: ult 1.5s ease forwards; padding: 0 20%; }
@keyframes ult { 0% { opacity: 0; letter-spacing: .5em; } 25% { opacity: 1; letter-spacing: .08em; } 80% { opacity: 1; } 100% { opacity: 0; } }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translate(0); } 20% { transform: translate(-8px, 4px); } 40% { transform: translate(7px, -5px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(4px, 5px); } }
.b-log { max-width: 900px; width: 100%; margin: 0 auto; height: 116px; overflow-y: auto; font-size: .9rem; border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.b-log .r { font-family: var(--f-display); color: var(--sun); margin-top: 4px; }
.b-ctrl { max-width: 900px; width: 100%; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.b-ctrl .btn { min-width: 0; }
.act { display: grid; gap: 0; text-align: center; line-height: 1.15; }
.act small { font-weight: 500; color: var(--muted); font-size: .72rem; }
.b-res { font-family: var(--f-display); font-size: 1.5rem; text-align: center; }

.modal { position: fixed; inset: 0; z-index: 90; background: rgba(6,8,18,.82); display: grid; place-items: center; padding: 16px; }
.modal-in { width: min(560px, 100%); max-height: 88vh; overflow-y: auto; background: var(--sky-1); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); translate: -50% 0; z-index: 200; background: var(--sky-2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; max-width: min(92vw, 520px); box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: tin .25s ease; }
.toast.bad { border-color: var(--bad); }
.toast.good { border-color: var(--good); }
@keyframes tin { from { opacity: 0; transform: translateY(10px); } }
.feed-item { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(46,58,110,.6); }
.feed-item time { color: var(--faint); font-size: .8rem; white-space: nowrap; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; }
.tac-row { display: grid; grid-template-columns: auto 1fr 80px 1fr; gap: 8px; align-items: center; }
@media (max-width: 560px) { .tac-row { grid-template-columns: auto 1fr; } }
.timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 600px) { .timeline { grid-template-columns: 1fr 1fr; } }
.tl { padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(10,13,28,.45); display: grid; gap: 4px; }
.tl.now { border-color: var(--sun); box-shadow: 0 0 20px -10px var(--sun); }
.story { font-size: 1.05rem; max-width: 66ch; color: var(--muted); }
.story::first-letter { font-family: var(--f-display); font-size: 2.4rem; float: left; line-height: 1; margin: 4px 8px 0 0; color: var(--sun); }
.intro { position: fixed; inset: 0; z-index: 150; background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,207,112,.18), transparent 70%), var(--sky-0); display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px); overflow-y: auto; }
.intro-in { max-width: 680px; width: 100%; display: grid; gap: 18px; text-align: center; justify-items: center; animation: fadeup .6s ease; }
@keyframes fadeup { from { opacity: 0; transform: translateY(12px); } }
.intro h2 { font-size: clamp(2rem, 7vw, 3.2rem); color: var(--sun); letter-spacing: .06em; }
.intro p { font-size: 1.12rem; color: var(--muted); max-width: 56ch; }
.intro-sils { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.intro-sils .sil { width: 62px; height: 78px; }
.ladder { display: grid; gap: 6px; width: min(360px, 100%); }
.ladder div { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(10,13,28,.5); display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; }
.ladder div:first-child { border-color: rgba(255,95,109,.6); color: var(--hp); }
.ladder div:last-child { border-color: rgba(255,207,112,.6); color: var(--sun); }
.goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; width: 100%; text-align: left; }
.goals > div { padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: rgba(10,13,28,.5); display: grid; gap: 6px; }
.intro-dots { display: flex; gap: 8px; }
.intro-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.intro-dots span.on { background: var(--sun); }
.tut { border-color: rgba(255,207,112,.45); margin-bottom: 22px; }
.tut-step { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed rgba(46,58,110,.7); }
.tut-step:last-child { border-bottom: 0; }
.tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--sun-ink); }
.tick.ok { background: var(--good); border-color: var(--good); }
.tick.claimed { background: var(--sun); border-color: var(--sun); }
.coach { width: 100%; text-align: center; font-size: .88rem; background: rgba(255,207,112,.1); border: 1px solid rgba(255,207,112,.4); border-radius: 8px; padding: 8px 12px; }
.howto details { border-bottom: 1px solid var(--line); padding-block: 4px; }
.howto summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
.howto ul { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 4px; color: var(--muted); }
.howto b { color: var(--fg); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

</head>
<body>
<div id="app">
  <header class="hud" id="hud" hidden>
    <div class="wrap">
      <div class="hud-in" id="hudIn"></div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Seções do jogo"></nav>
    </div>
  </header>
  <main class="wrap" id="view">
    <section class="hero">
      <div class="label">Temporada 1 · A Fenda de Sarnak</div>

/* ---------- recompensas ---------- */
function grant(p, rw, o = {}) {
  const out = []; const pb = p.cls === 'porta' && o.quest !== false ? 1.1 : 1;
  let xp = Math.round((rw.xp || 0) * pb * (o.mult || 1)); let gold = Math.round((rw.gold || 0) * pb * (o.mult || 1));
  if (gold) { p.gold = (p.gold || 0) + gold; out.push(`${fmt(gold)} de ouro`); }
  if (rw.items) for (const k in rw.items) { p.inv[k] = (p.inv[k] || 0) + rw.items[k]; out.push(`${rw.items[k]}× ${itemName(k)}`); }
  for (let i = 0; i < (rw.drop || 0); i++) { const k = pick(DROPS); p.inv[k] = (p.inv[k] || 0) + 1; out.push(`1× ${itemName(k)}`); }
  if (rw.points) { p.points = (p.points || 0) + rw.points; out.push(`+${rw.points} ponto de status`); }
  if (rw.equip) for (const s in rw.equip) { if (!p.equip[s] || (TIERS[p.equip[s].tier]?.b || 0) < TIERS[rw.equip[s]].b) { p.equip[s] = { tier: rw.equip[s] }; out.push(`${SLOTS[s].name} ${TIERS[rw.equip[s]].name}`); } }
  if (rw.title && !p.titles.includes(rw.title)) { p.titles.push(rw.title); out.push(`título "${rw.title}"`); if (!p.title) p.title = rw.title; }
  if (rw.cos && !p.cos.owned.includes(rw.cos)) { p.cos.owned.push(rw.cos); out.push(COSM[rw.cos].name); }
  if (xp) { out.unshift(`${fmt(xp)} XP`); addXp(p, xp); }
  return out;
}
function addXp(p, xp) {
  if (p.level >= 50) return;
  p.xp += xp;
  while (p.level < 50 && p.xp >= xpNeed(p.level)) {
    p.xp -= xpNeed(p.level); p.level++; p.points = (p.points || 0) + 3;
    p.hp = hpMaxOf(p); p.hpAt = now();
    pendingFx.push(() => { toast(`Nível ${p.level}! +3 pontos de status.`, 'good'); post(`${p.name} chegou ao nível ${p.level}.`, 'level'); });
    if (p.level >= 3 && p.invitedBy && !p.inviteRewarded) { p.inviteRewarded = true; const inv = p.invitedBy; pendingFx.push(() => rewardInviter(inv, p.name)); }
  }
}

function flushFx() { const f = pendingFx; pendingFx = []; f.forEach(fn => { try { fn(); } catch (e) { console.warn(e); } }); }
async function rewardInviter(uid, name) {
  const q = players.get(uid); if (!q) return;
  const owned = (q.cos?.owned || []).slice(); if (!owned.includes('moldura-recrutador')) owned.push('moldura-recrutador');
  try { await db.doc('players/' + uid).update({ gold: (q.gold || 0) + 100, cos: { owned } }); post(`${q.name} recebeu a recompensa de convite: ${name} chegou ao nível 3.`, 'invite'); } catch (e) { console.warn(e); }
}
function applyFightToSelf(p, F, o = {}) {
  p.hp = Math.max(o.minHp ?? 1, Math.round(F.hp)); p.hpAt = now();
  for (const k in F.used) {
    const before = stageOf(p.uses[k] || 0); p.uses[k] = (p.uses[k] || 0) + F.used[k]; const after = stageOf(p.uses[k]);
    if (after > before) { const nm = CLASSES[p.cls].moves[k].n[after - 1]; pendingFx.push(() => { toast(`Seu golpe evoluiu: ${nm}!`, 'good'); post(`O golpe de ${p.name} evoluiu para ${nm} (estágio ${['I', 'II', 'III'][after - 1]}).`, 'evo'); }); }
  }
  if (F.allowItems) for (const k of ['potP', 'potG', 'elixir']) p.inv[k] = F.inv[k];

let audioCtx = null;
function sfx(kind) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    const map = { hit: [180, 70, .12, 'square'], crit: [320, 60, .25, 'sawtooth'], miss: [600, 900, .08, 'sine'], heal: [500, 800, .2, 'sine'], conc: [220, 440, .35, 'triangle'], ult: [90, 40, .9, 'sawtooth'], win: [440, 880, .6, 'triangle'] };

    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.start(t); o.stop(t + d + .02);
  } catch (e) { /* som opcional */ }
}

  if (isRecovering(p)) return 'Você está se recuperando por mais ' + dur(p.recoverUntil - now()) + '.';

}

  const A = fighterFromPlayer(P, { items: true }); const B = npcFighter(E.name, lvl, { moves: E.moves });
  const finish = (winner, Af) => endPve({ winner, Af, kind: 'hunt', ek, lvl, mode });
  if (mode === 'rounds') interactiveBattle(A, B, {}, finish);
  else { const A0 = clone(A), B0 = clone(B); const Ac = clone(A), Bc = clone(B); const ctx = {}; const r = runAuto(Ac, Bc, ctx); const s = await endPve({ winner: r.winner, Af: Ac, kind: 'hunt', ek, lvl, mode, deferred: true }); await showReplay(A0, B0, r.events, s, flushFx); }
}

}

/* ---------- trabalho, loja, oficina ---------- */

/* ---------- banca ---------- */

/* ---------- saque ---------- */
function saqueCheck(q) {
  const p = P; const rev = (p.revenge || {})[q.uid] > now();
  if (q.uid === me) return 'Esse é você.';
  if (fightBlocked(p)) return fightBlocked(p);
  if (rev) return null;
  if ((p.saqueAt || 0) + 15 * MIN > now()) return `Você pode saquear de novo em ${dur(p.saqueAt + 15 * MIN - now())}.`;
  if (q.level < 5) return 'Jogadores abaixo do nível 5 não podem ser saqueados.';
  if (Math.abs(q.level - p.level) > 5) return 'Só vale saquear alvos com até 5 níveis de diferença.';
  if ((q.attackedAt || 0) + HOUR > now()) return `${q.name} foi saqueado há pouco. Protegido por mais ${dur(q.attackedAt + HOUR - now())}.`;
  if (((p.pairs || {})[q.uid] || 0) + 12 * HOUR > now()) return `Você só pode saquear ${q.name} de novo em ${dur(p.pairs[q.uid] + 12 * HOUR - now())}.`;
  if (curHp(p) < hpMaxOf(p) * 0.25) return 'Sua vida está abaixo de 25%.';
  if (curHp(q) < hpMaxOf(q) * 0.25) return `${q.name} está com a vida abaixo de 25%.`;
  return null;
}
async function doSaque(uid) {
  const q = players.get(uid); if (!q) return;
  const block = saqueCheck(q); if (block) return toast(block, 'bad');
  const revenge = (P.revenge || {})[uid] > now();
  if (q.cls === 'batedor' && rnd() < 0.10) {
    await save(p => { p.saqueAt = now(); p.pairs = p.pairs || {}; p.pairs[uid] = now(); });
    return toast(`${q.name} percebeu a emboscada e escapou pela trilha. Saque perdido.`, 'bad');
  }
  const A = fighterFromPlayer(P, { revenge }); const B = fighterFromPlayer(q, {});
  const A0 = clone(A), B0 = clone(B); const Ac = clone(A), Bc = clone(B);
  const r = runAuto(Ac, Bc, {});
  const won = r.winner === 'A';
  const sameOrHigher = q.level >= P.level;
  let goldMove = 0, xpGain = 0;
  if (won) { goldMove = Math.floor(exposedGold(q) * (0.05 + rnd() * 0.05)); xpGain = sameOrHigher ? 20 * q.level : 0; }
  else { goldMove = Math.floor(exposedGold(P) * 0.05); xpGain = sameOrHigher ? 8 * q.level : 0; }
  const lines = r.events.filter(e => e.txt && !e.quiet).map(e => e.txt).slice(-24);
  const report = { ts: now(), from: me, fromName: P.name, defenderWon: !won, gold: goldMove, lines };
  const upd = {
    gold: Math.max(0, (q.gold || 0) + (won ? -goldMove : goldMove)),
    hp: Math.max(1, Math.round(Bc.hp)), hpAt: now(), attackedAt: now(),
    reports: [report, ...(q.reports || [])].slice(0, 8),
    revenge: { [me]: now() + 12 * HOUR }
  };
  if (!won) { upd.wins = (q.wins || 0) + 1; }
  try { await db.doc('players/' + uid).update(upd); } catch (e) { return handleErr(e); }
  await save(p => {
    applyFightToSelf(p, Ac);
    if (won) { p.gold += goldMove; p.wins = (p.wins || 0) + 1; daily(p).wins++; } else { p.gold -= goldMove; p.losses = (p.losses || 0) + 1; }
    if (xpGain) addXp(p, xpGain);
    p.saqueAt = now(); p.pairs = p.pairs || {}; p.pairs[uid] = now(); markTut(p, 'social');
    if (revenge) { p.revenge = p.revenge || {}; p.revenge[uid] = 0; }
  });
  post(won ? `${P.name} saqueou ${q.name} e levou ${fmt(goldMove)} de ouro.` : `${q.name} repeliu o saque de ${P.name} e ficou com ${fmt(goldMove)} de ouro.`, 'saque');
  await showReplay(A0, B0, r.events, { title: won ? 'Saque bem-sucedido' : 'Saque repelido', text: (won ? `Você levou ${fmt(goldMove)} de ouro` : `Você pagou ${fmt(goldMove)} de ouro a ${q.name}`) + (xpGain ? ` · ${fmt(xpGain)} XP` : ' · sem XP (alvo de nível menor)') + (revenge ? ' · vingança cumprida' : '') }, flushFx);
}

/* ---------- duelos ---------- */
const allDuels = () => { const m = new Map(); [...duelsA, ...duelsB].forEach(d => m.set(d.id, d)); return [...m.values()].sort((a, b) => b.createdAt - a.createdAt); };

}

  <details><summary>Zonas e quests</summary><ul><li><b>História e caça:</b> derrote os inimigos pedidos e receba a recompensa.</li><li><b>Expedições, coletas e entregas:</b> correm no tempo real, até 2 ao mesmo tempo. As de 1 hora ou mais têm 25% de chance de emboscada na volta.</li><li><b>Chefes:</b> cada um tem uma mecânica própria. O <b>Modo Desafio</b> deixa o chefe mais forte e dá Essência de Desafio; o primeiro a vencer o chefe da zona no Desafio leva o item Lendário.</li><li><b>Chefes de grupo:</b> vida compartilhada entre todos, 3 tentativas por dia.</li><li><b>Diárias:</b> três por dia, renovam à meia-noite.</li></ul></details>
  <details><summary>Mirante</summary><ul><li><b>Trabalho:</b> escolha uma profissão no nível 3. Durante o turno você não luta nem compra, mas pode ser saqueado.</li><li><b>Loja:</b> Bronze só com ouro; Prata e Ouro também pedem materiais de chefes.</li><li><b>Cofre:</b> protege parte do seu ouro contra saques e derrotas.</li><li><b>Banca:</b> venda e compre itens de outros jogadores.</li></ul></details>
  <details><summary>Arena</summary><ul><li><b>Saque:</b> ataque alguém, mesmo offline. As duas táticas de defesa lutam. Vencendo, você leva 5% a 10% do ouro exposto dele; perdendo, paga 5% do seu.</li><li>Quem é saqueado ganha 12 horas de <b>vingança</b>, com +10% de dano.</li><li><b>Duelo:</b> desafie um amigo, com ou sem aposta. Cada jogada tem 2 minutos; se o tempo acabar, a tática joga por você.</li><li>Só dá XP lutar contra quem tem nível igual ou maior que o seu.</li></ul></details>
  </div><div class="row"><button class="btn" data-hi>Rever a introdução</button>${hidden ? '<button class="btn" data-ht>Mostrar primeiros passos</button>' : ''}<button class="btn primary" data-close>Fechar</button></div>`, m => {
    m.querySelector('[data-close]').onclick = closeModal;
    m.querySelector('[data-hi]').onclick = () => { closeModal(); showIntro(() => {}, false); };
    const t = m.querySelector('[data-ht]'); if (t) t.onclick = () => { LS.set('zenite-tut-hide', ''); closeModal(); render(); };
  });
}

/* ---------- ciclo ---------- */
function afterRenderNames() { if (tab === 'lutador' && P) { const n = $('#pName'); if (n) n.textContent = P.name; const m = $('#pMotto'); if (m) m.textContent = P.motto || ''; } }
const _render = render;
render = function () { _render(); afterRenderNames(); };
setInterval(() => { if (P && !battleOpen) { const ae = document.activeElement; if (!(ae && $('#view').contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT'))) render(); else renderHud(); } }, 20000);

/* ---------- servidor (Supabase) ---------- */
let sb = null;
function dbErr(code, message) { const e = new Error(message || code); e.code = code; return e; }
function splitPath(path) { const parts = path.split('/'); return { col: parts.slice(0, -1).join('/'), id: parts[parts.length - 1] }; }
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function mergeDeep(a, b) {
  if (!a || typeof a !== 'object' || Array.isArray(a) || !b || typeof b !== 'object' || Array.isArray(b)) return clone(b);
  const r = { ...a };
  for (const k in b) r[k] = (r[k] && typeof r[k] === 'object' && !Array.isArray(r[k]) && b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) ? mergeDeep(r[k], b[k]) : clone(b[k]);
  return r;
}
function makeDb(client) {
  const cols = new Map();
  function emit(st) { st.listeners.forEach(fn => { try { fn(); } catch (e) { console.warn(e); } }); }
  async function load(col, st) {
    const { data, error } = await client.from('docs').select('id,data').eq('col', col);
    if (error) { console.warn(error); return; }
    st.docs = new Map(data.map(r => [r.id, r.data])); st.ready = true; emit(st);
  }
  function colState(col) {
    let st = cols.get(col);
    if (st) return st;
    st = { listeners: new Set(), docs: new Map(), ready: false };
    cols.set(col, st);
    st.channel = client.channel('col-' + col.replace(/[^a-z0-9]/gi, '_'))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'col=eq.' + col }, pl => {
        if (pl.eventType === 'DELETE') { if (pl.old && pl.old.id) st.docs.delete(pl.old.id); }
        else if (pl.new) st.docs.set(pl.new.id, pl.new.data);
        emit(st);
      })
      .subscribe(status => { if (status === 'SUBSCRIBED') load(col, st); });
    load(col, st);
    st.poll = setInterval(() => load(col, st), 30000);
    return st;
  }
  const snapDoc = (id, data) => ({ id, exists: data !== undefined && data !== null, data: () => data, metadata: {} });
  function doc(path) {
    const { col, id } = splitPath(path);
    return {
      id, path,
      async get() { const { data, error } = await client.from('docs').select('data').eq('path', path).maybeSingle(); if (error) throw dbErr('unavailable', error.message); return snapDoc(id, data ? data.data : undefined); },
      async set(obj) {
        const body = clone(obj);
        const st = cols.get(col); if (st) { st.docs.set(id, body); emit(st); }
        const { error } = await client.from('docs').upsert({ path, col, id, data: body, updated_at: new Date().toISOString() });
        if (error) throw dbErr(error.code === '42501' ? 'auth' : 'unavailable', error.message);
      },
      async update(patch) {
        const body = clone(patch);
        const st = cols.get(col); if (st && st.docs.has(id)) { st.docs.set(id, mergeDeep(st.docs.get(id), body)); emit(st); }
        const { data, error } = await client.rpc('doc_update', { p_path: path, p_patch: body });
        if (error) throw dbErr('unavailable', error.message);
        if (data === false) throw dbErr('invalid_argument', 'documento inexistente');
      },
      async delete() {
        const st = cols.get(col); if (st) { st.docs.delete(id); emit(st); }
        const { error } = await client.from('docs').delete().eq('path', path);
        if (error) throw dbErr('unavailable', error.message);
      },
      async acquire(o) {
        const { data, error } = await client.rpc('doc_acquire', { p_path: path, p_holder: o.holder, p_ttl_ms: o.ttlMs || 30000 });
        if (error) throw dbErr('unavailable', error.message);
        return { acquired: !!data };
      },
      onSnapshot(next) {
        const st = colState(col);
        const fn = () => { if (st.ready) next(snapDoc(id, st.docs.get(id))); };
        st.listeners.add(fn); fn();
        return () => st.listeners.delete(fn);
      }
    };
  }
  function query(col, q) {
    const run = st => {
      let rows = [...st.docs.entries()].map(([id, data]) => ({ id, data }));
      for (const [f, op, v] of q.where) rows = rows.filter(r => op === '==' ? r.data[f] === v : op === '!=' ? r.data[f] !== v : true);
      if (q.order) { const [f, dir] = q.order; rows.sort((a, b) => ((a.data[f] ?? 0) - (b.data[f] ?? 0)) * (dir === 'desc' ? -1 : 1)); }
      if (q.lim) rows = rows.slice(0, q.lim);
      const docs = rows.map(r => snapDoc(r.id, r.data));
      return { docs, size: docs.length, empty: !docs.length, metadata: {} };
    };
    const api = {
      where: (f, op, v) => query(col, { ...q, where: [...q.where, [f, op, v]] }),
      orderBy: (f, dir = 'asc') => query(col, { ...q, order: [f, dir] }),
      limit: n => query(col, { ...q, lim: n }),
      async get() { const st = colState(col); if (!st.ready) await load(col, st); return run(st); },
      onSnapshot(next) { const st = colState(col); const fn = () => { if (st.ready) next(run(st)); }; st.listeners.add(fn); fn(); return () => st.listeners.delete(fn); },
      doc: id => doc(col + '/' + (id || rid())),
      async add(obj) { const ref = doc(col + '/' + rid()); await ref.set(obj); return ref; }
    };
    return api;
  }
  return { doc, collection: col => query(col, { where: [], order: null, lim: 0 }) };
}

function renderLogin(msg) {
  const v = $('#view');
  v.innerHTML = `<section class="hero"><div class="label">Temporada 1 · A Fenda de Sarnak</div><h1>Zênite</h1><p>Seis classes, cinco zonas e um topo do mundo em disputa. Entre para criar seu lutador e jogar com os amigos.</p></section>
  <form class="panel login" id="loginForm">
    <h2 id="lgTitle">Entrar</h2>
    <label class="stack" style="gap:6px"><span class="label">E-mail</span><input type="email" id="lgEmail" autocomplete="email" required></label>
    <label class="stack" style="gap:6px"><span class="label">Senha</span><input type="password" id="lgPass" autocomplete="current-password" minlength="6" required></label>
    <button class="btn primary" type="submit" id="lgGo">Entrar</button>
    <button class="btn sm" type="button" id="lgSwitch">Ainda não tenho conta</button>
    <p class="small muted" id="lgMsg">${esc(msg || '')}</p>
  </form>`;
  let mode = 'in';
  const sync = () => { $('#lgTitle').textContent = mode === 'in' ? 'Entrar' : 'Criar conta'; $('#lgGo').textContent = mode === 'in' ? 'Entrar' : 'Criar conta'; $('#lgSwitch').textContent = mode === 'in' ? 'Ainda não tenho conta' : 'Já tenho conta'; $('#lgPass').autocomplete = mode === 'in' ? 'current-password' : 'new-password'; };
  $('#lgSwitch').onclick = () => { mode = mode === 'in' ? 'up' : 'in'; sync(); $('#lgMsg').textContent = ''; };
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#lgEmail').value.trim(), password = $('#lgPass').value;
    $('#lgGo').disabled = true; $('#lgMsg').textContent = mode === 'in' ? 'Entrando…' : 'Criando sua conta…';
    try {
      const r = mode === 'in' ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password });
      if (r.error) throw r.error;
      if (!r.data.session) { $('#lgMsg').textContent = 'Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.'; mode = 'in'; sync(); return; }
      startGame(r.data.session.user.id);
    } catch (err) {
      const m = String(err.message || '');
      $('#lgMsg').textContent = /Invalid login/i.test(m) ? 'E-mail ou senha incorretos.' : /already registered/i.test(m) ? 'Esse e-mail já tem conta. Use "Já tenho conta".' : /Password should/i.test(m) ? 'A senha precisa ter pelo menos 6 caracteres.' : 'Não foi possível entrar: ' + m;
    } finally { $('#lgGo').disabled = false; }
  });
  $('#lgEmail').focus();
}
async function logout() { try { await sb.auth.signOut(); } catch (e) { /* segue */ } location.reload(); }
function copyInvite() {
  const link = location.origin + location.pathname + '#convite-' + P.inviteCode;
  const done = () => toast('Link de convite copiado. Mande para os amigos.', 'good');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => openModal(`<h2>Link de convite</h2><input type="text" value="${esc(link)}" readonly onfocus="this.select()"><button class="btn" data-close>Fechar</button>`, m => m.querySelector('[data-close]').onclick = closeModal));
  else openModal(`<h2>Link de convite</h2><input type="text" value="${esc(link)}" readonly onfocus="this.select()"><button class="btn" data-close>Fechar</button>`, m => m.querySelector('[data-close]').onclick = closeModal);
}
async function boot() {
  const cfg = window.ZENITE_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || /COLE/.test(cfg.supabaseUrl)) { offline('O servidor do jogo ainda não foi configurado.'); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data } = await sb.auth.getSession();
  if (!data.session) { renderLogin(); return; }
  startGame(data.session.user.id);
}
let started = false;
function startGame(uid) {
  if (started) return; started = true;
  me = uid; db = makeDb(sb);
  $('#view').innerHTML = '<section class="hero"><div class="label">Temporada 1 · A Fenda de Sarnak</div><h1>Zênite</h1><p class="muted small" id="bootMsg">Carregando o mundo de Zênite…</p></section>';
  myRef = db.doc('players/' + me);
  let gotPlayers = false;
  db.collection('players').onSnapshot(s => {
    players.clear(); s.docs.forEach(d => players.set(d.id, { ...d.data(), uid: d.id }));
    const mine = players.get(me);
    const firstMine = !P && mine;
    if (mine) P = mine;
    gotPlayers = true;
    if (!booted) { booted = true; }
    if (firstMine || P) render(); else if (!$('#createForm')) render();
  }, e => { console.warn(e); offline('Não foi possível carregar o mundo de Zênite. Recarregue a página.'); });
  db.collection('feed').orderBy('ts', 'desc').limit(60).onSnapshot(s => { feed = s.docs.map(d => d.data()); if (tab === 'mural') render(); }, e => console.warn(e));
  db.collection('banca').onSnapshot(s => { banca = s.docs.map(d => ({ id: d.id, ...d.data() })); if (tab === 'mirante') render(); }, e => console.warn(e));
  db.doc('world/lendarios').onSnapshot(s => { world.lendarios = s.exists ? s.data() : {}; if (tab === 'temporada') render(); }, e => console.warn(e));
  for (const bk of Object.keys(BOSSES).filter(k => BOSSES[k].group)) db.doc('world/grupo-' + bk).onSnapshot(s => { world.groups[bk] = s.exists ? s.data() : null; if (tab === 'zonas') render(); }, e => console.warn(e));
  const onDuels = which => s => { const arr = s.docs.map(d => ({ id: d.id, ...d.data() })); if (which === 'a') duelsA = arr; else duelsB = arr; if (P) { renderHud(); if (tab === 'arena') render(); }
    const incoming = arr.filter(d => d.status === 'pending' && d.b === me && now() - d.createdAt < 60000);
    incoming.forEach(d => { if (!seenChallenges.has(d.id)) { seenChallenges.add(d.id); toast(`${d.aName} te desafiou para um duelo. Veja na Arena.`); } });
    arr.filter(d => d.status === 'active' && d.a === me && !duelView && !openedOnce.has(d.id)).forEach(d => { openedOnce.add(d.id); openDuel(d.id); }); };
  db.collection('duels').where('a', '==', me).onSnapshot(onDuels('a'), e => console.warn(e));
  db.collection('duels').where('b', '==', me).onSnapshot(onDuels('b'), e => console.warn(e));
  setTimeout(() => { if (!gotPlayers) { booted = true; render(); } }, 6000);
}
const seenChallenges = new Set(), openedOnce = new Set();
function offline(msg) { const m = $('#bootMsg'); if (m) m.textContent = msg; }
boot().catch(e => { console.error(e); offline('Algo deu errado ao abrir o jogo. Recarregue a página.'); });
})();
</script>
